name: Android development APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: android-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_GIT_STATUS: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript and lint
        run: pnpm check

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nudgenda-standalone.apk
          sha256sum nudgenda-standalone.apk > nudgenda-standalone.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: nudgenda-standalone-apk
          path: |
            nudgenda-standalone.apk
            nudgenda-standalone.apk.sha256
          if-no-files-found: error
          retention-days: 14
